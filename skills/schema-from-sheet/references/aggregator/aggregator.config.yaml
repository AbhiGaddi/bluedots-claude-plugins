# Aggregator config for the {{display_name}} network, generated by schema-from-sheet.
# Structure taken from aggregator-dpg config/blue_dot/aggregator.config.yaml;
# that repo's aggregator.config.example.yaml documents every field.
aggregator:
  name: {{display_name}} Aggregator
  contact_email: ops@example.org
  network:
    # Where the portal fetches network.json. Overridable per deployment with
    # AGGREGATOR_NETWORK_SOURCE.
    source: {{network_source}}
    consent_source: {{consent_source}}
    csv_array_delimiter: '|'
    # Identity fields per domain (the person who logs in): used for dedup,
    # Keycloak linking and the Signals user payload. Same as each domain's
    # contact_fields in network.json.
    field_overrides:
{{field_overrides}}
  brand:
    short_name: {{display_name}}
    long_name: {{display_name}} Aggregator Portal
    tagline: Track every participant in your network — at a glance.
    url_slug: {{url_slug}}
    primary_color: '#0074ff'
    accent_color: '#57abff'
  signals:
    realm_roles: [signals_participant, signals_admin]
  domain_labels:
{{domain_labels}}
  onboarding:
    presume_consent: false
    bulk_max_rows: 10000
  registration_modes:
    voice:
      label_i18n_key: registration_mode.voice.label
      submission_shape: account_only
      public_hint_i18n_key: registration_mode.voice.hint
      signals_cta: false
    form:
      label_i18n_key: registration_mode.form.label
      submission_shape: account_and_profile
      public_hint_i18n_key: null
      signals_cta: true
  # Reviewers of new organisation registrations. ADMIN_EMAILS overrides this.
  admin_emails:
    - admin@example.org
